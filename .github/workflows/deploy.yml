name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build React app
        run: npm run build
        working-directory: client

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist/

      - name: Normalize EC2 connection secrets
        env:
          RAW_USER: ${{ secrets.EC2_USERNAME }}
          RAW_HOST: ${{ secrets.EC2_HOST }}
          RAW_ROOT: ${{ secrets.EC2_WEB_ROOT }}
        run: |
          USER_CLEAN=$(printf '%s' "$RAW_USER" | tr -d '[:space:]')
          HOST_CLEAN=$(printf '%s' "$RAW_HOST" | tr -d '[:space:]')
          ROOT_CLEAN=$(printf '%s' "$RAW_ROOT" | tr -d '[:space:]')
          echo "::add-mask::$USER_CLEAN"
          echo "::add-mask::$HOST_CLEAN"
          echo "::add-mask::$ROOT_CLEAN"
          {
            echo "EC2_USER=$USER_CLEAN"
            echo "EC2_HOST=$HOST_CLEAN"
            echo "EC2_WEB_ROOT=$ROOT_CLEAN"
          } >> "$GITHUB_ENV"

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Sync server code
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='client/node_modules' \
            --exclude='server/node_modules' \
            --exclude='client/dist' \
            --exclude='.claude' \
            --exclude='.env' \
            ./ "$EC2_USER@$EC2_HOST:$EC2_WEB_ROOT/"

      - name: Sync built client
        run: |
          rsync -avz --delete \
            client/dist/ "$EC2_USER@$EC2_HOST:$EC2_WEB_ROOT/client/dist/"

      - name: Write server .env from secrets
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLIENT_ORIGIN: ${{ secrets.CLIENT_ORIGIN }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          umask 077
          ENV_FILE="$(mktemp)"
          {
            printf 'PORT=3000\n'
            printf 'NODE_ENV=production\n'
            printf 'MONGO_URI=%s\n' "$MONGO_URI"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'CLIENT_ORIGIN=%s\n' "$CLIENT_ORIGIN"
            printf 'ADMIN_EMAIL=%s\n' "$ADMIN_EMAIL"
            printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD"
          } > "$ENV_FILE"
          chmod 600 "$ENV_FILE"
          scp -o StrictHostKeyChecking=no "$ENV_FILE" "$EC2_USER@$EC2_HOST:$EC2_WEB_ROOT/server/.env"
          ssh "$EC2_USER@$EC2_HOST" "chmod 600 $EC2_WEB_ROOT/server/.env"
          rm -f "$ENV_FILE"

      - name: Install server deps and restart PM2
        run: |
          ssh "$EC2_USER@$EC2_HOST" bash << EOF
            set -euo pipefail
            chmod -R o+rX $EC2_WEB_ROOT/client/dist
            cd $EC2_WEB_ROOT/server
            npm ci --omit=dev
            pm2 startOrReload ecosystem.config.cjs --update-env
            pm2 save
          EOF

      - name: Health probe
        run: |
          ssh "$EC2_USER@$EC2_HOST" bash << 'EOF'
            set -euo pipefail
            for i in 1 2 3 4 5 6; do
              if curl -fksS https://localhost/api/health | grep -q '"status":"ok"'; then
                echo "Health probe ok"; exit 0
              fi
              echo "Waiting for server (attempt $i)..."; sleep 2
            done
            echo "Health probe failed"; pm2 logs timeloop-snake --lines 50 --nostream || true; exit 1
          EOF
