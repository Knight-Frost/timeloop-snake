# Time Loop Snake - Nginx reverse proxy + SPA host
#
# Two TLS modes are supported:
#   1. Let's Encrypt (preferred for production with a real domain):
#        ssl_certificate     /etc/letsencrypt/live/<your-domain>/fullchain.pem;
#        ssl_certificate_key /etc/letsencrypt/live/<your-domain>/privkey.pem;
#   2. Self-signed (acceptable when only an EC2 IP is available):
#        ssl_certificate     /etc/ssl/certs/nginx-selfsigned.crt;
#        ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;
#
# Set server_name to your domain (e.g. snake.example.com) when using
# Let's Encrypt. Use _ (catchall) only with a self-signed cert.

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # TLS material - replace with the appropriate option from the header.
    ssl_certificate     /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;

    # Proxy API requests to Express
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Serve React build - SPA fallback to index.html
    location / {
        root  /home/ubuntu/timeloop-snake/client/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
